spring.application.name=spring-ai-budgeting-assistant

# --- Database (PostgreSQL only; the app account is a dedicated non-superuser, see compose.yaml) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/budgeting}
spring.datasource.username=${POSTGRES_USER:budgeting_app}
spring.datasource.password=${POSTGRES_PASSWORD:}

# Flyway is the single source of truth for the schema; Hibernate only validates it never creates/updates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- OpenAI (Spring AI) ---
# The key is read only from the environment. The fallback below is an obvious, non-functional
# placeholder that only exists so the application context (and tests that do not touch AI beans)
# can start without OPENAI_API_KEY; it is never a real credential and is rejected by OpenAI itself.
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-local-placeholder-not-a-real-key}
spring.ai.openai.audio.speech.response-format=mp3

# Autoconfigured OpenAI beans (chat/transcription/speech) are only used by the voice assistant
# flow; TRACE/DEBUG stays off by default so prompts, transcripts and responses never hit the logs.
logging.level.org.springframework.ai=INFO
logging.level.com.openai=INFO
logging.level.org.springframework.web.client=INFO
logging.level.org.apache.http=INFO

# --- Application security (HTTP Basic, see docs/security/secret-management.md) ---
# No default in real deployments: local placeholders below only keep the standard test suite
# and local `bootRun` from requiring a real credential to be configured up front.
app.security.username=${APP_SECURITY_USERNAME:local-dev-user}
app.security.password=${APP_SECURITY_PASSWORD:local-dev-password}

# --- Audio upload (see AudioUploadValidator for the allowlist enforced on top of these limits) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
